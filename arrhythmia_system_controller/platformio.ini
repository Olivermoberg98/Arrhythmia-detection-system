; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3cam

[env]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags = 
	-DCONFIG_NIMBLE_ENABLED=1
	-DCONFIG_BT_NIMBLE_ENABLED=1
    -I${PROJECT_SRC_DIR}
	-DSENSOR_TASK_STACK=8192
	-DBLE_TASK_STACK=8192

[env:esp32dev]
build_type = release
build_flags = 
	${env.build_flags}
	-DCORE_DEBUG_LEVEL=0
	-O2
	-DENABLE_SERIAL_CAPTURE=1
lib_deps = 
	h2zero/NimBLE-Arduino@^2.3.7

[env:esp32dev_debug]
build_type = debug
build_flags = 
	${env.build_flags}
	-DCORE_DEBUG_LEVEL=4
	-Og
	-DENABLE_SERIAL_CAPTURE=1
lib_deps = h2zero/NimBLE-Arduino@^2.3.7

; ESP32-S3-N16R8 camera board (CH343 USB-UART bridge, octal PSRAM).
; Board def is N8R8, so flash size and partitions are overridden to 16 MB.
[env:esp32s3cam]
board = freenove_esp32_s3_wroom
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; Auto-download-mode is unreliable here: hold BOOT for the whole upload.
build_type = release
build_flags = 
	${env.build_flags}
	-DCORE_DEBUG_LEVEL=0
	-O2
	-DENABLE_SERIAL_CAPTURE=1
lib_deps = 
	h2zero/NimBLE-Arduino@^2.3.7
