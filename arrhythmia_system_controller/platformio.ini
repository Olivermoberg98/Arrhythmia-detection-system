; ============================================================
; PlatformIO Configuration - Arrhythmia Detection System
; Target: ESP32 DevKit
; ============================================================

[platformio]
default_envs = esp32dev

; ---- Base shared settings ----
[env]
platform  = espressif32
framework = arduino
board     = esp32dev

monitor_speed  = 921600
monitor_filters = esp32_exception_decoder

build_flags =
    -DCONFIG_NIMBLE_ENABLED=1
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DARDUINO_USB_MODE=1
    ; FreeRTOS stack sizes (bytes)
    -DSENSOR_TASK_STACK=8192
    -DBLE_TASK_STACK=8192
    ; TFLite tensor arena (bytes) – tune to your model
    -DTFLITE_TENSOR_ARENA_SIZE=60000

lib_deps =
    h2zero/NimBLE-Arduino                                       @ ^1.4.2
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    ; TFLite Micro for ESP32 (Arduino-compatible port)
    tanakamasayuki/TensorFlowLite_ESP32                         @ ^0.0.1

; ---- Release build ----
[env:esp32dev]
build_type = release
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -O2
    ; Disable serial data capture in production
    -DENABLE_SERIAL_CAPTURE=0

; ---- Debug / data-capture build ----
[env:esp32dev_debug]
build_type = debug
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=4
    -Og
    ; Enable raw CSV stream over Serial for Python capture tool
    -DENABLE_SERIAL_CAPTURE=1