; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3cam

; Shared by the ESP32 environments (not by native).
[esp32]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags = 
	-DCONFIG_NIMBLE_ENABLED=1
	-DCONFIG_BT_NIMBLE_ENABLED=1
    -I${PROJECT_SRC_DIR}
	-DSENSOR_TASK_STACK=8192
	-DBLE_TASK_STACK=8192

[env:esp32dev]
extends = esp32
build_type = release
build_flags = 
	${esp32.build_flags}
	-DCORE_DEBUG_LEVEL=0
	-O2
	-DENABLE_SERIAL_CAPTURE=1
lib_deps = 
	h2zero/NimBLE-Arduino@^2.3.7

[env:esp32dev_debug]
extends = esp32
build_type = debug
build_flags = 
	${esp32.build_flags}
	-DCORE_DEBUG_LEVEL=4
	-Og
	-DENABLE_SERIAL_CAPTURE=1
lib_deps = h2zero/NimBLE-Arduino@^2.3.7

; ESP32-S3-N16R8 camera board (CH343 USB-UART bridge, octal PSRAM).
; Board def is N8R8, so flash size and partitions are overridden to 16 MB.
[env:esp32s3cam]
extends = esp32
board = freenove_esp32_s3_wroom
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; Auto-download-mode is unreliable here: hold BOOT for the whole upload.
build_type = release
build_flags = 
	${esp32.build_flags}
	-DCORE_DEBUG_LEVEL=0
	-O2
	-DENABLE_SERIAL_CAPTURE=1
lib_deps = 
	h2zero/NimBLE-Arduino@^2.3.7

; Host-side unit tests for the signal chain: pio test -e native
; Needs a host gcc on PATH (e.g. MSYS2 ucrt64).
[env:native]
platform = native
; Empty UNITY_WEAK_ATTRIBUTE: MinGW's ld crashes on Unity's weak setUp/tearDown
; (silent "ld returned 5"), so make them ordinary symbols. Tests must not define them.
build_flags = -std=gnu++17 -I${PROJECT_SRC_DIR} -DUNITY_WEAK_ATTRIBUTE=
test_build_src = yes
build_src_filter = -<*> +<signal_processing/SignalProcessor.cpp>
